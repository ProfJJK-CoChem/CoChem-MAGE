[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cochem-mage"
version = "0.1.0"
description = "CoChem-MAGE: Mass and Gas-chromatography Emulator"
authors = [{ name = "CoChem Team" }]
dependencies = [
    "jax",
    "jaxlib",
    "parsl",
    "networkx",
    "numpy",
    "scipy",
    "rdkit",
    "plotly",
    "xgboost",
    "h5py",
    "pyyaml",
    "requests"
]

[project.optional-dependencies]
test = [
    "pytest"
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
